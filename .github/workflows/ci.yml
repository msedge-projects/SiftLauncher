name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness
      - run: cargo fmt --all -- --check
      - run: python tools/licence_audit.py
      - run: cargo build --release --locked -p sift-desktop

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --release --locked -p sift-desktop
