[package]
name = "sift-net"
description = "Sift Launcher networking: auth, downloads, API clients (phase 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sift-core = { path = "../sift-core" }
# **A Rust TLS stack, not the system's.** The default features pull native-tls, which links `libssl.so.3` and
# `libcrypto.so.3` -- 1 104 + 228 kB resident in the mapping profile -- and on Windows means a vendored OpenSSL build in
# CI. rustls has no external library to link, so the same transport costs the binary a little code and the process no
# shared objects. Measured against the memory gate rather than assumed.
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
# The content store is named by digests, and the services do not agree on which
# one: Mojang publishes a sha1 per asset and library and a sha1 for the asset
# index itself, Modrinth publishes a sha1 and a sha512 per file, and Prism's
# metadata publishes a sha256. All three are verified rather than trusted, so all
# three are computed. Same version the desktop crate and this one's own dev
# dependencies already use, so it adds no package to the lock file.
sha1 = "0.10"
# `auth` builds the entitlements request id itself: the endpoint takes a UUID
# and answers an empty item list without one. Already in the workspace lock file.
uuid.workspace = true
# `forge` reads the launch profile out of the loader's installer jar, which is
# a zip. Same version `sift-loader` already uses, so it adds no package to
# the lock file.
zip = "0.6"

[dev-dependencies]
tempfile = "3"
