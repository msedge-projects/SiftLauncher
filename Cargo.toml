[workspace]
resolver = "2"
members = [
  "crates/sift-core",
  "crates/sift-net",
  "crates/sift-loader",
  "crates/sift-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/msedge-projects/SiftLauncher"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
iced = "0.13"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
lto = true
